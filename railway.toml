# Railway config-as-code (deprecated by Railway, honoured until 2026-12-01; the same values are
# also set on the service itself, so behaviour does not depend on this file).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
# Enum spelling matters: "on-failure" is rejected with "deploy.restartPolicyType: Invalid input".
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
