[package]
name = "amigo-oculto"
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
description = "Sorteio de amigo oculto para a família: cria o evento, sorteia e avisa cada um por email."
license = "MIT"
publish = false

[[bin]]
name = "amigo-oculto"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = { version = "0.8", features = ["macros", "form", "query"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dotenvy = "0.15"
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "pool",
  "tokio1",
  "tokio1-rustls-tls",
  "hostname",
] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "migrate",
  "macros",
] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
url = "2"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.askama_derive]
opt-level = 3
