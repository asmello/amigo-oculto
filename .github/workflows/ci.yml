name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  docker:
    runs-on: ubuntu-latest
    needs: [fmt, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amigo-oculto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (server boots, migrates, renders, sends log mail)
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e PORT=8080 \
            -e BASE_URL=http://localhost:8080 \
            -e MAIL_TRANSPORT=log \
            amigo-oculto:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break || sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Criar sorteio"
          curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8080/static/app.css | grep -q 200
          curl -fsS -X POST -H "Origin: http://localhost:8080" \
            -d "name=Teste&event_date=2027-12-24&organizer_name=Ana&organizer_email=ana%40exemplo.com" \
            -o /dev/null -w "%{redirect_url}" http://localhost:8080/criar | grep -q "/verificar/"
          docker logs smoke | grep -q "email (log transport)"
          docker rm -f smoke
